<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guest Check-in — Mmedara & Ikedinachi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap"
    rel="stylesheet">

  <!-- Load the barcode scanning library -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    :root {
      --wine: #2A0E14;
      --ivory: #F5EFE6;
      --coral: #E24E42;
      --gold: #B8935A;
      --display: 'Fraunces', Georgia, serif;
      --text: 'Newsreader', Georgia, serif;
      --sans: 'Inter', system-ui, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background-color: var(--wine);
      color: var(--ivory);
      font-family: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .kicker {
      font-family: var(--sans);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--gold);
      margin: 0 0 12px;
    }

    .title {
      font-family: var(--display);
      font-style: italic;
      font-weight: 400;
      font-size: clamp(32px, 6vw, 48px);
      line-height: 1;
      margin: 0;
      color: var(--ivory);
    }

    .scanner-card {
      background: var(--ivory);
      padding: 24px;
      border: 1px solid var(--gold);
      max-width: 400px;
      width: 100%;
      box-sizing: border-box;
      position: relative;
    }

    .scanner-card::before {
      content: '';
      position: absolute;
      inset: -8px;
      border: 1px solid rgba(184, 147, 90, 0.3);
      pointer-events: none;
    }

    #reader {
      width: 100%;
      border-radius: 4px;
      overflow: hidden;
      border: 2px solid var(--wine);
    }

    /* Style the default buttons inside the scanner */
    #reader button {
      background: var(--wine) !important;
      color: var(--ivory) !important;
      border: none !important;
      padding: 12px 20px !important;
      font-family: var(--sans) !important;
      font-size: 11px !important;
      letter-spacing: 0.1em !important;
      text-transform: uppercase !important;
      cursor: pointer !important;
      border-radius: 0 !important;
      margin-top: 10px !important;
    }

    #result {
      margin-top: 24px;
      font-family: var(--display);
      font-size: 18px;
      font-style: italic;
      font-weight: 600;
      min-height: 30px;
      text-align: center;
      color: var(--wine);
      transition: color 0.3s ease;
    }

    .success {
      color: #1E3A2F !important;
    }

    .error {
      color: var(--coral) !important;
    }
  </style>
</head>

<body>

  <div class="header">
    <p class="kicker">Mmedara & Ikedinachi</p>
    <h1 class="title">Guest Check-in</h1>
  </div>

  <div class="scanner-card">
    <div id="reader"></div>
    <div id="result">Waiting for scan...</div>
  </div>

  <script>
    // PASTE YOUR APPS SCRIPT URL HERE (same as the main site)
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxF99SNmYVjGpomFK_yHtG7hPM9CG0Vaw24K01wkf7YdyGdhhhHXOlCgWhlejSk6Sju/exec';

    function onScanSuccess(decodedText, decodedResult) {
      // Pause scanning while we process the check-in
      html5QrcodeScanner.pause(true);

      const resultDiv = document.getElementById('result');
      resultDiv.className = '';
      resultDiv.innerText = 'Processing...';

      // Send the scanned text via GET request
      const url = SCRIPT_URL + '?formType=CheckIn&GuestData=' + encodeURIComponent(decodedText);

      fetch(url)
        .then(response => response.json())
        .then(data => {
          if (data.result === 'success') {
            resultDiv.className = 'success';
            resultDiv.innerText = '✅ Checked in: ' + decodedText;
          } else {
            resultDiv.className = 'error';
            resultDiv.innerText = '❌ ' + data.message;
          }

          // Resume scanning after 2 seconds
          setTimeout(() => {
            resultDiv.innerText = 'Waiting for scan...';
            html5QrcodeScanner.resume();
          }, 2500);
        })
        .catch((err) => {
          resultDiv.className = 'error';
          resultDiv.innerText = '❌ Network error. Try again.';
          setTimeout(() => {
            resultDiv.innerText = 'Waiting for scan...';
            html5QrcodeScanner.resume();
          }, 2500);
        });
    }

    // Initialize the scanner
    const html5QrcodeScanner = new Html5QrcodeScanner(
      "reader", { fps: 10, qrbox: { width: 250, height: 250 } }
    );
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>

</html>
